<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Launcher</title>
    <style>
      :root {
        --bg: #efefef;
        --ink: #1f1f1f;
        --shadow: rgba(19, 18, 18, 0.18);
        --phone-dark: #0d0f13;
        --phone-mid: #1e252b;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .page {
        width: min(1100px, 92vw);
        padding: 36px 10px 0;
      }

      .devices {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 18px;
        height: 288px;
      }

      .phone {
        position: relative;
        width: 185px;
        height: 240px;
        border-radius: 28px;
        background: linear-gradient(180deg, #171b20 0%, #090b0f 100%);
        box-shadow: 0 18px 22px rgba(0, 0, 0, 0.12), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .phone:nth-child(2) {
        width: 200px;
        height: 262px;
        transform: translateY(12px);
      }

      .phone:nth-child(3) {
        opacity: 0.95;
      }

      .phone::before {
        content: "";
        position: absolute;
        inset: 8px 7px auto 7px;
        height: 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .phone::after {
        content: "";
        position: absolute;
        width: 64px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        bottom: 7px;
        left: 50%;
        transform: translateX(-50%);
      }

      .screen {
        position: absolute;
        inset: 18px 10px 18px 10px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(42,54,65,0.8) 0%, rgba(15,18,22,0.95) 100%);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .phone:nth-child(1) .screen,
      .phone:nth-child(3) .screen {
        background: linear-gradient(180deg, rgba(29,38,48,0.92) 0%, rgba(12,15,18,1) 100%);
      }

      .top-strip {
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgba(255, 255, 255, 0.8);
        font-size: 9px;
        letter-spacing: 0.7px;
      }

      .signal {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .signal i {
        display: block;
        width: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.8);
      }

      .signal i:nth-child(1) { height: 5px; }
      .signal i:nth-child(2) { height: 8px; }
      .signal i:nth-child(3) { height: 11px; }
      .signal i:nth-child(4) { height: 14px; }

      .battery {
        width: 18px;
        height: 9px;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.72);
        padding: 1px;
      }

      .battery span {
        display: block;
        width: 72%;
        height: 100%;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .clock {
        position: absolute;
        inset: 54px 0 auto;
        text-align: center;
        color: rgba(255,255,255,0.95);
      }

      .clock strong {
        display: block;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .clock small {
        display: block;
        margin-top: 6px;
        font-size: 8px;
        color: rgba(255,255,255,0.75);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .mini-date {
        position: absolute;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,0.72);
        text-transform: uppercase;
      }

      .phone:nth-child(1) .mini-date,
      .phone:nth-child(3) .mini-date {
        top: 120px;
      }

      .status-line {
        position: absolute;
        left: 50%;
        top: 118px;
        transform: translateX(-50%);
        width: 70%;
        border-radius: 999px;
        height: 4px;
        opacity: 0.5;
        background: linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.4), rgba(255,255,255,0.15));
      }

      .apps {
        position: absolute;
        left: 50%;
        bottom: 42px;
        transform: translateX(-50%);
        width: 74%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 10px;
        justify-items: center;
      }

      .apps span {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        background: linear-gradient(180deg, rgba(104, 196, 255, 0.9), rgba(76, 125, 203, 0.9));
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
      }

      .phone:nth-child(2) .apps span {
        background: linear-gradient(180deg, rgba(124, 224, 232, 0.72), rgba(92, 121, 208, 0.72));
      }

      .phone:nth-child(3) .apps span {
        background: linear-gradient(180deg, rgba(177, 199, 214, 0.72), rgba(144, 154, 184, 0.68));
      }

      .phone:nth-child(2) .clock strong {
        font-size: 32px;
      }

      .phone:nth-child(2) .top-strip {
        font-size: 8px;
      }

      .phone:nth-child(2) .screen {
        background: linear-gradient(180deg, rgba(19, 28, 32, 0.92), rgba(12, 12, 16, 0.96));
      }

      .phone:nth-child(2) .status-line {
        top: 128px;
      }

      .phone:nth-child(1) .clock strong {
        font-size: 26px;
      }

      .bubble {
        position: relative;
        margin: 6px auto 0;
        width: min(760px, 86vw);
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(30, 30, 30, 0.08);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.05);
        padding: 30px 30px 24px;
      }

      .bubble p {
        margin: 0;
        color: #000;
        font-size: clamp(20px, 2vw, 24px);
        line-height: 1.8;
        direction: rtl;
        text-align: right;
        unicode-bidi: plaintext;
      }

      @media (max-width: 760px) {
        .page {
          width: min(440px, 96vw);
          padding-top: 22px;
        }

        .devices {
          gap: 12px;
          height: 220px;
        }

        .phone {
          width: 120px;
          height: 176px;
        }

        .phone:nth-child(2) {
          width: 132px;
          height: 190px;
        }

        .phone:nth-child(1) .clock strong,
        .phone:nth-child(2) .clock strong,
        .phone:nth-child(3) .clock strong {
          font-size: 18px;
        }

        .clock small {
          font-size: 7px;
          letter-spacing: 0.12em;
        }

        .bubble {
          width: min(100%, 94vw);
          padding: 20px 18px 18px;
        }

        .bubble p {
          font-size: 18px;
          line-height: 1.7;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="devices" aria-label="Flip launcher previews">
        <article class="phone" aria-label="Phone preview">
          <div class="screen">
            <div class="top-strip">
              <div class="signal" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="battery" aria-hidden="true"><span></span></div>
            </div>
            <div class="clock"><strong>2:40</strong><small>Wed 26</small></div>
            <div class="mini-date">26/10/2026</div>
            <div class="status-line"></div>
            <div class="apps" aria-hidden="true">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </div>
          </div>
        </article>

        <article class="phone" aria-label="Phone preview with active clock">
          <div class="screen">
            <div class="top-strip">
              <div class="signal" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="battery" aria-hidden="true"><span></span></div>
            </div>
            <div class="clock"><strong>2:40</strong><small>Wednesday</small></div>
            <div class="mini-date">OCT 26</div>
            <div class="status-line"></div>
            <div class="apps" aria-hidden="true">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </div>
          </div>
        </article>

        <article class="phone" aria-label="Phone preview">
          <div class="screen">
            <div class="top-strip">
              <div class="signal" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="battery" aria-hidden="true"><span></span></div>
            </div>
            <div class="clock"><strong>2:40</strong><small>Wednesday</small></div>
            <div class="mini-date">OCT 26</div>
            <div class="status-line"></div>
            <div class="apps" aria-hidden="true">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </div>
          </div>
        </article>
      </section>

      <section class="bubble" aria-label="Arabic announcement">
        <p>
          هتتبقى لك ملع بليوم في قمة للأوقات، يبقى هناك وقت للتخطيط
          والالتزام بدقة. هذا هو المزيج اللي يخلّيك متفوقًا في كل ما تفعله، حتى لو كان
          بعيدًا عن حاجاتك اليومية.
        </p>
      </section>
    </main>
  </body>
</html>
